name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK (debug, assinado com a chave de debug)
        working-directory: apk
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Guardar como artefato
        uses: actions/upload-artifact@v4
        with:
          name: BedrockHost-apk
          path: apk/app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar na aba Releases (link fixo para baixar no celular)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Bedrock Host APK (ultima versao)
          prerelease: true
          files: apk/app/build/outputs/apk/debug/app-debug.apk
