services:
  cubolandia:
    build: .
    restart: unless-stopped
    ports:
      - "25565:25565/udp"   # ENet (padrão)
      - "25565:25565/tcp"   # só usado com CUBO_WS=1 (WebSocket)
    environment:
      CUBO_SERVER: "1"
      CUBO_PORT: "25565"
      CUBO_WS: "0"          # 1 = WebSocket (para hospedagens que só aceitam TCP/HTTP)
      CUBO_CREATIVE: "0"
      # CUBO_SEED: "12345"
    volumes:
      - cubo-data:/data
volumes:
  cubo-data:
