# Endereço dos servidores PÚBLICOS.
# Rode o servidor numa máquina com porta aberta (UDP) e coloque aqui o IP ou domínio:
#   godot --headless --path . -- --server starcat      (porta 25565)
#   godot --headless --path . -- --server auralis      (porta 25566)
# Todos os jogadores que tocarem em "Jogar" no servidor entram nesse mesmo mundo.
# Também pode ser criado como user://servers.cfg no aparelho (sobrescreve este).

[server_starcat]
address=""
port=25565

[server_auralis]
address=""
port=25566
